name: Docker Build CI

on:
  pull_request:
    paths:
      - 'keploy-ci*/**'
      - .github/workflows/docker-build.yml
      - .github/workflows/publish.yml
  push:
    branches:
      - main
    paths:
      - 'keploy-ci*/**'
      - .github/workflows/docker-build.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  # ── Stage 0: the minio-cache helper and the s3.sh client it speaks through
  # are duplicated per build context (Docker cannot COPY outside a context).
  # Drift between copies is how the ILM rule-spam regression shipped, so fail
  # fast when they diverge.
  helper-parity:
    name: "minio-cache / s3.sh copies identical, no mc"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare every baked minio-cache against the canonical copy
        run: |
          set -eux
          canonical=keploy-ci-node/minio-cache
          status=0
          for f in $(git ls-files '*/minio-cache'); do
            [ "$f" = "$canonical" ] && continue
            diff -u "$canonical" "$f" || status=1
          done
          exit $status

      # s3.sh is the one S3 client every Keploy repo carries as
      # .ci/scripts/s3.sh (scripts/ci/s3.sh in k8s-proxy), byte-identical
      # everywhere. The copies here must be that exact file: change it in every
      # repo at once, then move this hash.
      - name: Every baked s3.sh is the shared copy
        run: |
          set -eu
          want=0ad1be42cad01a41fc7d3ec2fc55eb0fe9b41cf0c797febd335418560a2b0249
          status=0
          n=0
          for f in $(git ls-files '*/s3.sh'); do
            n=$((n + 1))
            got=$(sha256sum "$f" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$f sha256 $got, want the shared copy's $want"; status=1; }
          done
          # Every context that ships minio-cache must ship s3.sh beside it.
          for f in $(git ls-files '*/minio-cache'); do
            [ -f "$(dirname "$f")/s3.sh" ] || { echo "::error::$(dirname "$f") ships minio-cache without s3.sh"; status=1; }
            grep -q 'COPY s3.sh /usr/local/lib/keploy-ci/s3.sh' "$(dirname "$f")/Dockerfile" \
              || { echo "::error::$(dirname "$f")/Dockerfile does not install s3.sh where minio-cache looks for it"; status=1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no s3.sh copies found"; status=1; }
          # s3-test.sh (the suite the live step runs against the baked s3.sh) is
          # the shared copy too: the client and its suite move together.
          want_test=de21838cf744fb72ce39982b1e8f623964b0bf7377a090a5d510f88e0926ba2f
          nt=0
          for f in $(git ls-files '*/s3-test.sh'); do
            nt=$((nt + 1))
            got=$(sha256sum "$f" | cut -d' ' -f1)
            [ "$got" = "$want_test" ] || { echo "::error::$f sha256 $got, want the shared copy's $want_test"; status=1; }
          done
          [ "$nt" -gt 0 ] || { echo "::error::no s3-test.sh copy found"; status=1; }
          exit $status

      # MinIO withdrew its distribution (dl.min.io answers 410 Gone, the Docker
      # Hub images are gone) and the CI store is SeaweedFS, reached over S3 with
      # s3.sh. No image here may install, fetch or call MinIO's mc again, and no
      # helper may write a bucket lifecycle rule (locked on the store).
      - name: No MinIO client, no lifecycle writes
        run: |
          set -eu
          files=$(git ls-files 'keploy-ci*/Dockerfile' '*/minio-cache' '*.sh' | grep -v '/s3.sh$' | grep -v '/s3-test.sh$')
          # Comment lines are allowed to mention the history. The client in every
          # form: by name (mc, or the Alpine package's mcli), by any path ending
          # in one of those, through a variable named for it, with global flags
          # before the subcommand; a variable given the client; its install,
          # download or probe; and lifecycle writes. (minio-cache itself is this
          # repo's helper, so running it is not flagged here.)
          start='(^|[[:space:];&|(!{`'"'"'"=])'
          flags='[[:space:]]+(--?[[:alnum:]_-]+([= ][^[:space:]]+)?[[:space:]]+)*'
          subw='alias|cp|cat|stat|ls|mb|rb|rm|mv|mirror|find|share|pipe|admin|ilm|head|tag|od|du|diff|sql|version|ready|anonymous|policy|retention|event|replicate|encrypt|legalhold|undo|watch|tree|support|license|update|config|idp|quota|batch|get|put|ping'
          sub='('"$subw"'|"\$@"|\$@|"\$\*")([[:space:];)'"'"'"]|$)'
          # \mc (skips shell aliases) is the same call; so is an argv list
          # (["mc", "cp", ...] / spawn('mc', ['cp', ...])).
          q='["'"'"']'
          argv="$q"'([^"'"'"'[:space:]]*/)?(mc|mcli)'"$q"'[[:space:]]*,[[:space:]]*\[?[[:space:]]*('"$q"'--?[[:alnum:]_-]+(=[^"'"'"']*)?'"$q"'[[:space:]]*,[[:space:]]*)*'"$q"'('"$subw"')'"$q"
          call="$start"'\\?([^[:space:];&|()<>'"'"'"`]*/)?(mc|mcli)["'"'"']?'"$flags$sub|$start"'"?\$\{?[A-Za-z_]*(mc|MC)(_[A-Z]+)?\}?"?'"$flags$sub|$argv"
          assign='(^|[[:space:];&|(])[A-Za-z_][A-Za-z0-9_]*=["'"'"']?([^[:space:]"'"'"'=;]*/)?(mc|mcli)([[:space:]]+--?[[:alnum:]_-]+)*["'"'"']?([[:space:];&|]|$)'
          # Any MinIO download host, the Alpine/Debian package, the Homebrew
          # formula or tap, a probe, MC_CONFIG_DIR or an MC_HOST_<alias> credential.
          install='minio/mc([^[:alnum:]_]|$)|dl\.min\.io|(^|[^[:alnum:]_-])minio-client([^[:alnum:]_-]|$)|/bin/mc(li)?([^[:alnum:]_-]|$)|command -v mc(li)?([^[:alnum:]_]|$)|which mc(li)?([^[:alnum:]_]|$)|MC_CONFIG_DIR|(^|[^[:alnum:]_-])minio-mc([^[:alnum:]_-]|$)|minio/stable/mc([^[:alnum:]_]|$)|dl\.minio\.(io|org\.cn)|(^|[^[:alnum:]_])MC_HOST_[[:alnum:]_]'
          lifecycle='put-bucket-lifecycle|[?&]lifecycle([=&[:space:]]|$)'
          hits=$(grep -nE -- "$call|$assign|$install|$lifecycle" $files \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::MinIO's mc (or a lifecycle write) is back; the CI store is reached with s3.sh"
            exit 1
          fi

  # ── Stage 1: base images (no cross-image deps) ─────────────────────
  base-images:
    name: "${{ matrix.tag-prefix || 'base' }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- multi-arch images ---
          - context: ./keploy-ci
            tag-prefix: ''
            arch: amd64
          - context: ./keploy-ci
            tag-prefix: ''
            arch: arm64
          - context: ./keploy-ci-slim
            tag-prefix: 'slim-'
            arch: amd64
          - context: ./keploy-ci-slim
            tag-prefix: 'slim-'
            arch: arm64
          - context: ./keploy-ci-timefreeze
            tag-prefix: 'timefreeze-'
            arch: amd64
          - context: ./keploy-ci-timefreeze
            tag-prefix: 'timefreeze-'
            arch: arm64
          - context: ./keploy-ci-golint
            tag-prefix: 'golint-'
            arch: amd64
          - context: ./keploy-ci-golint
            tag-prefix: 'golint-'
            arch: arm64
          - context: ./keploy-ci-awscli
            tag-prefix: 'awscli-'
            arch: amd64
          - context: ./keploy-ci-awscli
            tag-prefix: 'awscli-'
            arch: arm64
          - context: ./keploy-ci-azurecli
            tag-prefix: 'azurecli-'
            arch: amd64
          - context: ./keploy-ci-azurecli
            tag-prefix: 'azurecli-'
            arch: arm64
          # --- amd64-only images ---
          - context: ./keploy-ci-go-build
            tag-prefix: 'go-build-'
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag-prefix || 'base' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: keploy-ci:${{ matrix.tag-prefix }}ci-${{ matrix.arch }}

  # ── Stage 2: images that derive FROM keploy-ci ─────────────────────
  # Exercise the BASE_TAG threading that publish.yml relies on.
  #
  # Without this, the only test of that mechanism is a production release: the
  # matrix jobs above build with push:false and pass NO build-args, so they
  # exercise the Dockerfile's ARG DEFAULTS (already-published tags), never the
  # release path where a derived image builds FROM the base produced minutes
  # earlier in the same run.
  #
  # Scope, stated honestly: this proves base -> node, the tier whose breakage
  # caused the original bug (node pinned keploy-ci:1.2.23 through nine releases
  # and so never inherited Go 1.27). It does NOT build playwright, whose image is
  # ~3.6GB and would dominate PR time; tier 3 uses the identical mechanism with a
  # different prefix, and the contract check below covers its wiring statically.
  base-tag-threading:
    name: BASE_TAG threading
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Every derived image must take the base as an arg
        run: |
          set -eu
          fail=0
          for d in keploy-ci-node keploy-ci-java keploy-ci-python \
                   keploy-ci-kube keploy-ci-playwright keploy-ci-lighthouse; do
            grep -q '^ARG BASE_TAG=' "$d/Dockerfile" || { echo "::error::$d/Dockerfile has no ARG BASE_TAG"; fail=1; }
            grep -qF 'FROM ghcr.io/keploy/keploy-ci:${BASE_TAG}' "$d/Dockerfile" \
              || { echo "::error::$d/Dockerfile does not build FROM the BASE_TAG arg — a hard-coded base never inherits a base bump"; fail=1; }
          done
          # Tier 3 builds FROM node, so publish.yml must hand it a node- prefix.
          grep -q 'BASE_TAG=node-' .github/workflows/publish.yml \
            || { echo "::error::publish.yml never passes a node- prefixed BASE_TAG"; fail=1; }
          exit "$fail"

      # The ARG defaults are what a bare local `docker build` and the
      # derived-images matrix below build on. Before 1.2.40 every base shipped
      # MinIO's mc, so a default older than that quietly puts mc back in the
      # image this PR tests while the published one has none.
      - name: BASE_TAG defaults name an mc-less base
        run: |
          set -eu
          floor=1.2.40
          fail=0
          for d in keploy-ci-node keploy-ci-java keploy-ci-python keploy-ci-kube \
                   keploy-ci-playwright keploy-ci-lighthouse; do
            def=$(sed -n 's/^ARG BASE_TAG=//p' "$d/Dockerfile")
            case "$d" in
              keploy-ci-playwright|keploy-ci-lighthouse) want_prefix=node- ;;
              *) want_prefix= ;;
            esac
            ver=${def#"$want_prefix"}
            if [ -n "$want_prefix" ] && [ "$ver" = "$def" ]; then
              echo "::error::$d/Dockerfile: BASE_TAG default '$def' must be a node- tag (tier 3 builds FROM node)"; fail=1; continue
            fi
            if ! printf '%s' "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$d/Dockerfile: BASE_TAG default '$def' is not ${want_prefix}X.Y.Z"; fail=1; continue
            fi
            if [ "$(printf '%s\n%s\n' "$floor" "$ver" | sort -V | head -n1)" != "$floor" ]; then
              echo "::error::$d/Dockerfile: BASE_TAG default '$def' predates $floor, whose base still ships mc"; fail=1
            fi
          done
          exit "$fail"

      # metadata-action's default flavor is latest=auto, which adds a bare
      # `latest` to EVERY type=semver rule regardless of its pattern prefix. With
      # no flavor set, each leg of each publish job pushed `latest` and the last
      # to finish won (at v1.2.40 it was playwright). Only the base leg may.
      #
      # The check parses publish.yml with PyYAML. A pinned interpreter and a
      # pinned PyYAML, rather than whatever the runner image's system python3
      # happens to carry: a missing module there would red every PR here.
      - name: Set up Python for the publish.yml check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Only the base image may publish a bare latest
        run: |
          python -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.2"
          python - <<'PY'
          import sys, yaml
          wf = yaml.safe_load(open(".github/workflows/publish.yml"))
          # Split so the runner does not evaluate it as an expression here.
          base_expr = "latest=$" + "{{ matrix.tag-prefix == '' && 'auto' || 'false' }}"
          errors, seen = [], 0
          for name, job in wf["jobs"].items():
              for step in job.get("steps", []):
                  if not str(step.get("uses", "")).startswith("docker/metadata-action@"):
                      continue
                  seen += 1
                  flavor = str((step.get("with") or {}).get("flavor", "")).strip()
                  prefixes = [leg.get("tag-prefix") for leg in job["strategy"]["matrix"]["include"]]
                  if "" in prefixes:
                      ok = flavor == base_expr and prefixes.count("") == 1
                  else:
                      ok = flavor == "latest=false"
                  if not ok:
                      errors.append(f"{name}: metadata-action flavor is {flavor!r}; want "
                                    + (repr(base_expr) if "" in prefixes else "'latest=false'"))
          if seen != 4:
              errors.append(f"expected 4 metadata-action steps in publish.yml, found {seen}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      # Deliberately NOT setup-buildx-action. That action makes a
      # docker-container builder the default, and that driver resolves `FROM`
      # against the REGISTRY — so a base built here with load:true lands in the
      # local daemon where the next build cannot see it, and the build fails with
      # "ghcr.io/keploy/keploy-ci:pr-threading-test: not found". Plain
      # `docker build` uses the default docker driver, which reads and writes the
      # local image store, which is exactly what chaining two builds needs.
      - name: Build the base, then node FROM that local base
        run: |
          set -eux
          docker build -t ghcr.io/keploy/keploy-ci:pr-threading-test ./keploy-ci
          docker build --build-arg BASE_TAG=pr-threading-test \
            -t keploy-ci-node:pr-threading-test ./keploy-ci-node

      - name: No mc in the base or the derived image; node carries the shared s3.sh
        run: |
          set -eu
          for img in ghcr.io/keploy/keploy-ci:pr-threading-test keploy-ci-node:pr-threading-test; do
            if docker run --rm --entrypoint sh "$img" -c 'command -v mc || command -v mcli || [ -e /usr/local/bin/mc ]'; then
              echo "::error::$img still ships MinIO's mc"; exit 1
            fi
          done
          got=$(docker run --rm --entrypoint sha256sum keploy-ci-node:pr-threading-test /usr/local/lib/keploy-ci/s3.sh | cut -d' ' -f1)
          [ "$got" = 0ad1be42cad01a41fc7d3ec2fc55eb0fe9b41cf0c797febd335418560a2b0249 ] \
            || { echo "::error::node's /usr/local/lib/keploy-ci/s3.sh is not the shared copy ($got)"; exit 1; }

      # minio-cache and s3.sh inside the image the lanes run, against the CI
      # store's server: SeaweedFS 4.47, digest-pinned exactly as keploy/k8s-proxy's
      # chart pins it. `mini -dir=/data` is the image's own default command,
      # spelled out: master, volume, filer and S3 on :8333 in one process, with
      # S3 auth on because the credentials are set (not secrets; nothing else
      # can reach it).
      - name: minio-cache and s3.sh against SeaweedFS 4.47
        env:
          SEAWEEDFS_IMAGE: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
        run: |
          set -eu
          docker network create s3net
          # The server's own log is the first thing to read when any check fails.
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs --tail 80 seaweedfs 2>&1 || true; docker rm -f seaweedfs >/dev/null 2>&1 || true; docker network rm s3net >/dev/null 2>&1 || true' EXIT
          docker run -d --name seaweedfs --network s3net \
            -e AWS_ACCESS_KEY_ID=docker-images-ci -e AWS_SECRET_ACCESS_KEY=docker-images-ci-not-a-secret \
            -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 "$SEAWEEDFS_IMAGE" mini -dir=/data
          run() {
            docker run --rm --network s3net -v "$PWD/keploy-ci-node:/t:ro" \
              -e MINIO_ENDPOINT=http://seaweedfs:8333 -e MINIO_ACCESS_KEY=docker-images-ci \
              -e MINIO_SECRET_KEY=docker-images-ci-not-a-secret -e S3_TEST_BUCKET=woodpecker \
              --entrypoint sh keploy-ci-node:pr-threading-test -c "$1"
          }
          run 'i=0; until curl -sf -o /dev/null http://seaweedfs:8333/healthz; do i=$((i+1)); [ $i -lt 120 ] || { echo "SeaweedFS not healthy after 120 s"; exit 1; }; sleep 1; done'
          # The shared client's own suite, live, in this image (its curl, its sh),
          # against the image's INSTALLED copy: s3-test.sh tests the s3.sh beside
          # it, so it is dropped next to /usr/local/lib/keploy-ci/s3.sh.
          run 'cp /t/s3-test.sh /usr/local/lib/keploy-ci/ && S3_TEST_LIVE=1 S3_TEST_LARGE_MB=64 sh /usr/local/lib/keploy-ci/s3-test.sh'
          # minio-cache round trip through the image's own copies.
          run 'set -eu
            mkdir -p /root/cachetest/sub && head -c 3000000 /dev/urandom > /root/cachetest/sub/blob
            want=$(md5sum < /root/cachetest/sub/blob)
            CACHE_PATHS=/root/cachetest:/root/does-not-exist minio-cache save ci-roundtrip
            rm -rf /root/cachetest
            CACHE_PATHS=/root/cachetest minio-cache restore ci-roundtrip
            [ "$(md5sum < /root/cachetest/sub/blob)" = "$want" ] || { echo "restored bytes differ"; exit 1; }
            out=$(CACHE_PATHS=/root/cachetest minio-cache restore absent-key) || { echo "a miss did not exit 0"; exit 1; }
            case "$out" in *"cold start"*) ;; *) echo "a miss was not reported as a cold start: $out"; exit 1 ;; esac
            if MINIO_SECRET_KEY=wrong CACHE_PATHS=/root/cachetest minio-cache save ci-roundtrip; then
              echo "a save the store refused reported success"; exit 1
            fi
            # A stream that does not arrive whole never unpacks as a whole cache:
            # the object is rewritten with one byte changed but the MD5 the
            # writer declared, so s3.sh streams its first 1 MiB ranges and
            # withholds the last. tar has started on /root/cachetest by then;
            # the restore removes that directory, says so, is a cold start, and
            # leaves alone a cache directory the stream never reached.
            S3=/usr/local/lib/keploy-ci/s3.sh
            sh "$S3" get woodpecker/caches/ci-roundtrip.tar.zst /tmp/good.zst
            good=$(md5sum < /tmp/good.zst | cut -d" " -f1); cp /tmp/good.zst /tmp/bad.zst
            printf Z | dd of=/tmp/bad.zst bs=1 seek=100 conv=notrunc 2>/dev/null
            curl -sf -o /dev/null -T /tmp/bad.zst --aws-sigv4 aws:amz:us-east-1:s3 -u "$MINIO_ACCESS_KEY:$MINIO_SECRET_KEY" \
              -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -H "x-amz-meta-s3sh-md5: $good" \
              "$MINIO_ENDPOINT/woodpecker/caches/ci-roundtrip.tar.zst"
            mkdir -p /root/cachetest /root/untouched && echo stale > /root/cachetest/stale && echo baked > /root/untouched/f
            out=$(S3_PART_BYTES=1048576 CACHE_PATHS=/root/cachetest:/root/untouched minio-cache restore ci-roundtrip 2>&1) \
              || { echo "a corrupt cache failed the lane: $out"; exit 1; }
            case "$out" in *"s3.sh exit 6"*"removed the partly unpacked /root/cachetest;"*) ;; *) echo "a corrupt cache was not reported as one, with what was removed: $out"; exit 1 ;; esac
            [ ! -e /root/cachetest ] || { echo "a stream that did not arrive whole left a cache behind"; exit 1; }
            [ "$(cat /root/untouched/f)" = baked ] || { echo "a cache directory the stream never reached was removed"; exit 1; }
            # A store that cannot answer unpacks nothing, so it removes nothing:
            # what the image had there (browsers baked into a cache path) stays.
            mkdir -p /root/cachetest && echo baked > /root/cachetest/f
            out=$(MINIO_ENDPOINT=http://127.0.0.1:9 S3_RETRIES=2 S3_RETRY_DELAY=0 S3_CONNECT_TIMEOUT=2 \
              CACHE_PATHS=/root/cachetest minio-cache restore ci-roundtrip 2>&1) || { echo "an unreachable store failed the lane: $out"; exit 1; }
            case "$out" in *"s3.sh exit 5"*"nothing had been unpacked; the cache directories are as they were"*) ;; *) echo "an unreachable store was not reported as one: $out"; exit 1 ;; esac
            [ "$(cat /root/cachetest/f)" = baked ] || { echo "an unreachable store removed a cache it never unpacked into"; exit 1; }
            rm -rf /root/cachetest
            # Without the baked copy it falls back to the s3.sh beside it (the
            # repo checkout), and a set CDPATH must not corrupt that path.
            rm /usr/local/lib/keploy-ci/s3.sh
            out=$(CDPATH=/ CACHE_PATHS=/root/cachetest sh /t/minio-cache restore absent-key) || { echo "fallback lookup failed"; exit 1; }
            case "$out" in *"cold start"*) ;; *) echo "fallback lookup did not reach the store: $out"; exit 1 ;; esac
            echo "minio-cache: save/restore/miss/refused/corrupt/unreachable all behave"'

      - name: The derived image must carry the base's Go, not a stale one
        run: |
          set -eu
          want="$(grep -m1 '^ARG GO_VERSION=' keploy-ci/Dockerfile | cut -d= -f2)"
          got="$(docker run --rm --entrypoint go keploy-ci-node:pr-threading-test version | awk '{print $3}' | sed 's/^go//')"
          echo "base declares GO_VERSION=$want; node reports go$got"
          [ "$want" = "$got" ] || {
            echo "::error::node was built on a base with go$got but keploy-ci declares $want — BASE_TAG threading is broken"
            exit 1
          }
          docker run --rm --entrypoint sh keploy-ci-node:pr-threading-test -c 'command -v npx >/dev/null' \
            || { echo "::error::node image lost npx"; exit 1; }


  derived-images:
    name: "${{ matrix.tag-prefix }} (${{ matrix.arch }})"
    needs: base-images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./keploy-ci-node
            tag-prefix: 'node-'
            arch: amd64
          - context: ./keploy-ci-node
            tag-prefix: 'node-'
            arch: arm64
          - context: ./keploy-ci-java
            tag-prefix: 'java-'
            arch: amd64
          - context: ./keploy-ci-java
            tag-prefix: 'java-'
            arch: arm64
          - context: ./keploy-ci-python
            tag-prefix: 'python-'
            arch: amd64
          - context: ./keploy-ci-python
            tag-prefix: 'python-'
            arch: arm64
          - context: ./keploy-ci-kube
            tag-prefix: 'kube-'
            arch: amd64
          - context: ./keploy-ci-kube
            tag-prefix: 'kube-'
            arch: arm64
          - context: ./keploy-ci-playwright
            tag-prefix: 'playwright-'
            arch: amd64
          - context: ./keploy-ci-lighthouse
            tag-prefix: 'lighthouse-'
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag-prefix }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
